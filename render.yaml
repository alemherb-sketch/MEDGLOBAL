services:
  - type: web
    name: medglobal-backend
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.7
      # Clave de firma de los tokens de sesion. generateValue hace que Render
      # cree una aleatoria y la conserve entre despliegues. Sin esta variable
      # el backend genera una propia en disco, pero el filesystem de Render es
      # efimero y cada deploy cerraria todas las sesiones abiertas.
      - key: SECRET_KEY
        generateValue: true
      # Origenes autorizados a llamar al API desde un navegador, separados por
      # comas. Si se despliega el frontend en otro dominio, agregarlo aqui.
      - key: ALLOWED_ORIGINS
        value: https://medglobal.erpgest.com.pe
      - key: DATABASE_URL
        fromDatabase:
          name: medglobal-db
          property: connectionString

  - type: web
    name: medglobal-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: VITE_API_URL
        fromService:
          type: web
          name: medglobal-backend
          property: host

databases:
  - name: medglobal-db
    databaseName: medglobal
    user: medglobal
